<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealtyCo | Contact</title>
    <link rel="stylesheet" href="style.css">
    <style>

    .form-card {
      background: rgba(11, 2, 88, 0.07);
      border: 1px solid rgba(16, 10, 92, 0.25);
      border-left: 5px solid rgb(32, 17, 88);
      border-radius: 16px;
      padding: 32px 28px;
      backdrop-filter: blur(6px);
    }

    /* Small label above "Send Us a Message" */
    .form-label {
      font-size: 0.68rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgb(16, 15, 83);
      margin-bottom: 4px;
    }

    .form-card h3 {
      color: rgb(23, 7, 94);
      font-size: 1.2rem;
      margin: 0 0 24px;
    }

    /* Two-column row for name + email */
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* Wrapper for each label + input pair */
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 18px;
    }

    /* Labels above each input */
    .form-group label {
      font-size: 0.72rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: rgba(29, 16, 100, 0.75);
      margin-bottom: 6px;
    }

    /* All text inputs, email, and textarea */
    .form-group input,
    .form-group textarea {
      background: rgba(4, 5, 73, 0.473);
      border: 1px solid rgba(26, 7, 94, 0.3);
      border-radius: 10px;
      color: white;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 0.88rem;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.25s;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(7, 6, 71, 0.35);
    }

    /* Gold border glow when the field is active */
    .form-group input:focus,
    .form-group textarea:focus {
      border-color: rgb(26, 14, 78);
      box-shadow: 0 0 0 3px rgba(5, 3, 85, 0.12);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 120px;
    }

    /* Submit button */
    .btn-submit {
      display: block;
      width: 100%;
      background: rgb(94, 78, 143);
      color: #acc2cc;
      border: none;
      border-radius: 10px;
      font-family: 'Segoe UI', Arial, sans-serif;
      font-size: 0.9rem;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 13px;
      cursor: pointer;
      transition: background 0.25s, transform 0.15s;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: #060457;
      transform: translateY(-1px);
    }

    .btn-submit:active {
      transform: translateY(0);
    }
    </style>
</head>
<body>


<header class="navbar">
    <div class="logo">RealtyCo</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="buy.html">Buy</a>
        <a href="rent.html">Rent</a>
        <a href="valuation.html">Valuation</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>


<section class="page-title">
    <h1 style="">We're here to help</h1>
</section>


<section class="contact-container">

    <div class="form-card">

      <p class="form-label">Get in Touch</p>
      <h3>Send Us a Message</h3>

      <!-- Name + Email side by side -->
      <div class="form-row">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input type="text" id="fullname" placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="your@email.com">
        </div>
      </div>

      <!-- Subject -->
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" placeholder="What is this about?">
      </div>

      <!-- Message -->
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" placeholder="Write your message here…"></textarea>
      </div>

      <!-- Submit -->
      <button class="btn-submit" onclick="submitForm()">Send Message</button>

    </div><!-- end form-card -->


    
    <div class="office-info">
        <h2>Office Info</h2>
        <p><strong>Address:</strong> 123 Main Street</p>
        <p><strong>Phone:</strong> +267 75 338 982</p>
        <p><strong>Hours:</strong> 9:00 AM – 5:00 PM</p>

        <div class="contact-grid">
            <div class="form-card">
                <div class="info-card">
            
    </div>

</section>


<footer class="footer">
    <p>© 2026 RealtyCo | Privacy | Terms</p>
</footer>

</body>
</html>
