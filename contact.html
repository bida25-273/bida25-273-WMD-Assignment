<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RealtyCo Contact Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">🏠 RealtyCo</div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="buy.html">Buy</a></li>
                <li><a href="rent.html">Rent</a></li>
                <li><a href="valuation.html">Valuation</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>
    <!-- Hero Section -->
    <section class="hero">
        <h1>We're here to help</h1>
    </section>
    <!-- Main Content -->
    <main class="container">
        <!-- Contact Form -->
        <section class="contact-form">
            <h2>Contact Form</h2>
            <form>
                <label>Name *</label>
                <input type="text" required>
                <label>Email *</label>
                <input type="email" required>
                <label>Phone</label>
                <input type="tel">
                <label>Message *</label>
                <textarea rows="5" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>
        <section class="office-info">
            <h2>Office Info</h2>
            <p><strong>Address:</strong> 123 Main Street</p>
            <p><strong>Phone:</strong> +267 123 4567</p>
            <p><strong>Hours:</strong> 9:00 AM - 5:00 PM</p>
        </section>
    </main>
    <footer>
        <p>© 2026 RealtyCo | Privacy | Terms</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
     <script src="script.js"></script>
</body>
</html>
