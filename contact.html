    <!-- Contact Form -->
    <div class="contact-form">
        <h2>Contact Form</h2>

        <form>
            <label>Name *  </label>
            <input type="text" required><br>

            <label>Email * </label>
            <input type="email" required><br>

            <label>Phone * </label>

            <label>Message *</label>
            <textarea rows="5" required></textarea><br>

            <button type="submit">Send Message</button>
        </form>
    </div>

    
    <div class="office-info">
        <h2>Office Info</h2>
        <p><strong>Address:</strong> 123 Main Street</p>
        <p><strong>Phone:</strong> +267 XXX XXX</p>
        <p><strong>Hours:</strong> 9:00 AM – 5:00 PM</p>

        <div class="contact-grid">
            <div class="form-card">
                <div class="info-card">
            
    </div>
