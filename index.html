<body>

    
    <header class="navbar">
        <div class="logo">🏠 RealtyCo</div>

        <ul>
            <li><a href="index.html">Home</a></li>

    </section>

        <div class="property-card house">

            <div class="property-info">
                <h3>$250,000</h3>

                <button class="detailsBtn">Details</button>  
            </div>
        </div>


        
        <div class="property-card apartment">

            <img src="images.jpg/featured-2.jpg.jfif" alt="House 2">

            <div class="property-info">
                <h3>$350,000</h3>
                <p>Modern City Apartment</p>

                <button class="detailsBtn">Details</button>
            </div>
        </div>


        
        <div class="property-card house">

            <img src="images.jpg/featured-3.jpg.jfif" alt="House 3">

            <div class="property-info">
                <h3>$180,000</h3>
                <p>Cozy Starter Home</p>
   <button class="detailsBtn">Details </button>
            </div>
        </div>

    </section>


    
    <footer>
        <p>© 2026 RealtyCo | Privacy | Terms</p>
    </footer>
